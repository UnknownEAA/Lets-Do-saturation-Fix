# Builds the mod on GitHub's servers every time files are uploaded or changed,
# and whenever you press "Run workflow" on the Actions tab.
# The finished .jar appears under the run's "Artifacts" section.
name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the files
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build --no-daemon

      - name: Upload the mod jar
        uses: actions/upload-artifact@v4
        with:
          name: fcb_saturation_fix-jar
          path: build/libs/*.jar
          if-no-files-found: error
