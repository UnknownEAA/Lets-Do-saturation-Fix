# ---------------------------------------------------------------------------
# The settings you might change are at the top. See docs/1-BUILD.md.
# ---------------------------------------------------------------------------

# Your name or username, shown in the in-game mod list. CHANGE THIS.
mod_authors=YOUR_NAME_HERE

# Bump this every time you upload a new file to CurseForge (1.0.0 -> 1.0.1 -> ...).
mod_version=1.0.0

# Where people should report problems with this mod. Optional; replace with your
# GitHub repository's issues page once you have one.
mod_issue_tracker=https://www.curseforge.com/minecraft/mc-mods

# ---------------------------------------------------------------------------
# You normally don't need to change anything below this line.
# ---------------------------------------------------------------------------
mod_id=fcb_saturation_fix
mod_name=Saturation Fix for Farm & Charm and Brewery
mod_license=MIT
mod_group_id=com.fcbsatfix

minecraft_version=1.21.1
neo_version=21.1.267

org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
